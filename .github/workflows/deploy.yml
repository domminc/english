name: 배포

# main 에 푸시되거나 Actions 화면에서 직접 실행하면 배포한다.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEON_API_KEY
# 선택 Secret: ANTHROPIC_API_KEY (있으면 단어 이미지를 만든다). 선택 Variable: IMAGE_LIMIT (한 번에 만들 개수, 기본 20)
on:
  push:
    branches: [main, claude/daily-english-learning-app-0mak5i]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 검사
        run: |
          npm run typecheck
          npm test
          npm run content:check
      - name: Secrets 확인
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$NEON_API_KEY" ]; then
            echo "::warning::Secrets 3개(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEON_API_KEY)가 아직 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Neon · R2 · Hyperdrive 준비
        id: provision
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/provision.mjs
      - name: DB 스키마와 콘텐츠 적재
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Worker 배포
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sed -i 's/"id": "00000000000000000000000000000000"/"id": "${{ steps.provision.outputs.hyperdrive_id }}"/' wrangler.jsonc
          if ! npm run deploy; then
            echo "::warning::english.richislet.com 연결에 실패해 workers.dev 주소로만 배포합니다. 토큰에 해당 도메인(Zone)의 Workers Routes 편집 권한이 있는지 확인해 주세요."
            sed -i '/"routes": \[/d' wrangler.jsonc
            npm run deploy
          fi
      - name: 대문 사이트(richislet.com) 임시 배포
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx wrangler deploy -c portal/wrangler.jsonc
          node scripts/portal-domains.mjs
      - name: 발음 음성 생성과 R2 업로드
        if: steps.secrets.outputs.ready == 'true'
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          bash scripts/upload-audio.sh
      - name: 단어 이미지 생성과 R2 업로드 (Claude API)
        if: steps.secrets.outputs.ready == 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_LIMIT: ${{ vars.IMAGE_LIMIT || '20' }}
        run: node scripts/make-images.mjs
